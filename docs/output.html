               <p xmlns="http://www.tei-c.org/ns/1.0" part="N">It is absolutely essential to have high <span xmlns="http://www.w3.org/1999/xhtml" class="glossary-term" title="Intelligence is quite similar to what is currently known as intelligence quotient, but it also includes mnemonic ability, reasoning, and learning ability outside those measured by the written word.">intelligence</span> for a character who
                  is a magic-user - especially if a broad selection of spells is to be
                  had, as well as the use of the highest level spells. A magic-user must
                  have an <span xmlns="http://www.w3.org/1999/xhtml" class="glossary-term" title="Intelligence is quite similar to what is currently known as intelligence quotient, but it also includes mnemonic ability, reasoning, and learning ability outside those measured by the written word.">intelligence</span> of no less than 9 and a minimum dexterity of 6. For
                  details of the effects of <span xmlns="http://www.w3.org/1999/xhtml" class="glossary-term" title="Intelligence is quite similar to what is currently known as intelligence quotient, but it also includes mnemonic ability, reasoning, and learning ability outside those measured by the written word.">intelligence</span> an spell use, see
                  
                  <emph rend="bold">CHARACTER ABILITIES</emph>. A magic-user with <span xmlns="http://www.w3.org/1999/xhtml" class="glossary-term" title="Intelligence is quite similar to what is currently known as intelligence quotient, but it also includes mnemonic ability, reasoning, and learning ability outside those measured by the written word.">intelligence</span>
                  of 16 or mare also gains the benefit of adding 10% to experience points
                  awarded to him or her by the Dungeon Master.</p>
               
               <p xmlns="http://www.tei-c.org/ns/1.0" part="N">Magic-users draw upon arcane powers in order to exercise their
                  profession. While they have mighty spells of offensive, defensive, and
                  informational nature, magic-users are very weak in combat. They have but
                  four-sided dice (d4) to determine how many hit points of damage they can
                  withstand, and magic-users have the least favorable table and
                  progression as regards missile and melee combat. Furthermore, they can
                  wear no armor and have few weapons they can use, for martial training is
                  so foreign to magic-use as to make the two almost mutually exclusive.
                  Magicusers can be of any alignment (explained hereafter). </p>
               
               <p xmlns="http://www.tei-c.org/ns/1.0" part="N">When a magic-user begins his or her profession, the character is usually
                  assumed to possess a strange tome in which he or she has scribed the
                  formulae for some of the spells known to the character. This spell book,
                  and each book later added (as the magic-user advances in levels of
                  ability, a book of spells for each higher level of spells which become
                  usable will have to have been prepared through study and research), must
                  be maintained by the magic-user. He or she must memorize and prepare for
                  the use of each spell, and its casting makes it necessary to reabsorb
                  the incantation by consulting the proper book of spells before it can
                  again be cast. (See 
                  <emph rend="bold">CHARACTER SPELLS</emph> for more details.)
                  As with a11 other types of spells, those of magic-users must be spoken
                  or read aloud. </p>
               
               <p xmlns="http://www.tei-c.org/ns/1.0" part="N">There are many powerful items of magic which only this class of character
                  can employ. Most magic scrolls, wands, staves, and many of the
                  miscellaneous items of magic are usable only by this class. Thus, while
                  magic-users are not strong in combat with weapons, they are possibly the
                  most fearsome of all character classes when high levels of ability are
                  finally attained. Survival to that point can be a problem, however, as
                  lowlevel magic-users are quite weak. </p>
               
               <p xmlns="http://www.tei-c.org/ns/1.0" part="N">When a magic-user attains 1 lth level (Wizard) or higher, he or she may
                  enchant items or scribe magic scrolls. This process requires the
                  undivided attention of the magic-user for quite long periods of time -
                  weeks to months - and it is also costly. As the Dungeon Master is
                  carefully instructed to keep exact record of game time spent in such
                  activity, the magic-user will effectively remove himself or herself from
                  a number of adventures while enchanting items or inscribing scrolls of
                  magic spells. As this relative inactivity means that the character will
                  not get experience points and treasure (monetary or magical) gained from
                  adventures which toke place during the inactive period, it is not usual
                  for a Wizard to manufacture many items or scrolls. However, as
                  occasional enchantment of items or penning of magic scrolls will take
                  place, your referee has complete information on the process, including
                  probabilities, time required, materials needed, and costs. </p>
               
               <p xmlns="http://www.tei-c.org/ns/1.0" part="N">It is possible for a magic-user of 12th or higher level to construct a
                  stronghold and clear the countryside in a 10 or 20 mile radius of all
                  monsters, thus ruling an area much as a noble. If this is accomplished,
                  a revenue of 5 silver pieces per inhabitant per month is generated in
                  the territory ruled. </p>
               
               <p xmlns="http://www.tei-c.org/ns/1.0" part="N">This is a fake paragraph I am using to demonstrate that it can also find <span xmlns="http://www.w3.org/1999/xhtml" class="glossary-term" title="Strength is a measure of muscle, endurance, and stamina combined.">strength</span>, <span xmlns="http://www.w3.org/1999/xhtml" class="glossary-term" title="Wisdom is a composite term for the character’s enlightenment, judgement, wile, will power, and (to a certain extent) intuitiveness. It is of utmost importance to clerics, their major characteristic.">wisdom</span>, <span xmlns="http://www.w3.org/1999/xhtml" class="glossary-term" title="Charisma is the measure of the character's combined physical attractiveness, persuasiveness, and personal magnetism.">charisma</span>, and <span xmlns="http://www.w3.org/1999/xhtml" class="glossary-term" title="Constitution is a term which encompasses the character’s physique, fitness, health, and resistance.">constitution</span></p>
